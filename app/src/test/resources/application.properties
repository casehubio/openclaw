# Use random port to avoid conflicts when tests are run repeatedly
quarkus.http.test-port=0

# Suppress strict config validation for embedded application.properties in test deps
# (casehub-qhorus embeds app.properties that augmentation rejects as unmapped when the
#  extension's @ConfigMapping root isn't registered during augmentation)
smallrye.config.mapping.validate-unknown=false

# Index qhorus-testing jar so CDI can discover InMemory*Store @Alternative beans
%test.quarkus.index-dependency.qhorus-testing.group-id=io.casehub
%test.quarkus.index-dependency.qhorus-testing.artifact-id=casehub-qhorus-testing
%test.quarkus.index-dependency.engine-testing.group-id=io.casehub
%test.quarkus.index-dependency.engine-testing.artifact-id=casehub-engine-testing
%test.quarkus.index-dependency.engine-persistence-memory.group-id=io.casehub
%test.quarkus.index-dependency.engine-persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.platform-testing.group-id=io.casehub
quarkus.index-dependency.platform-testing.artifact-id=casehub-platform-testing

# Qhorus named datasource — in-memory H2 for tests
%test.quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:openclaw-qhorus-test;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.flyway.qhorus.migrate-at-start=false
%test.quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
# Load native SQL tables not created by JPA drop-and-create (ledger_subject_sequence for QhorusSequenceAllocator)
quarkus.hibernate-orm.qhorus.sql-load-script=import-qhorus.sql

# openclaw named datasource — in-memory H2 for tests
%test.quarkus.datasource.openclaw.jdbc.url=jdbc:h2:mem:openclaw-test;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.flyway.openclaw.migrate-at-start=false

# Required config with no default — must be set for Quarkus to start in tests.
# The delivery base-url is not exercised by ChannelContextWindowResource tests.
%test.casehub.openclaw.delivery.base-url=http://localhost:${quarkus.http.test-port}

# Makes FixedCurrentPrincipal @Alternative @Priority(1) the winning CurrentPrincipal in tests,
# displacing OidcCurrentPrincipal @RequestScoped (activated by casehub-platform-oidc, openclaw#41).
# QhorusInboundCurrentPrincipal is excluded globally via quarkus.arc.exclude-types in
# main application.properties — it no longer competes in any profile.
quarkus.arc.selected-alternatives=io.casehub.platform.testing.FixedCurrentPrincipal

# Demo agent config for ExampleControllerTest — all three example agent sets
%test.casehub.openclaw.agents.planner.capabilities=planning
%test.casehub.openclaw.agents.planner.session-key=planner
%test.casehub.openclaw.agents.coder.capabilities=coding
%test.casehub.openclaw.agents.coder.session-key=coder
%test.casehub.openclaw.agents.reviewer.capabilities=code-review
%test.casehub.openclaw.agents.reviewer.session-key=reviewer
%test.casehub.openclaw.agents.signal.capabilities=market-analysis
%test.casehub.openclaw.agents.signal.session-key=signal
%test.casehub.openclaw.agents.risk.capabilities=risk-assessment
%test.casehub.openclaw.agents.risk.session-key=risk
%test.casehub.openclaw.agents.execution.capabilities=trade-execution
%test.casehub.openclaw.agents.execution.session-key=execution
%test.casehub.openclaw.agents.investigator.capabilities=incident-investigation
%test.casehub.openclaw.agents.investigator.session-key=investigator
%test.casehub.openclaw.agents.resolver.capabilities=incident-resolution
%test.casehub.openclaw.agents.resolver.session-key=resolver
# Examples enabled by default in tests
%test.casehub.example.enabled=true
%test.casehub.example.tenancyid=demo

# OIDC test config — casehub-platform-oidc is on the compile classpath (openclaw#41).
# The %test profile does not inherit %dev.quarkus.oidc.enabled=false, so quarkus-oidc
# starts in tests and must not attempt OIDC discovery.
# GE-20260521-f50602: discovery-disabled requires jwks-path (lazy-loaded; never fetched
# when @TestSecurity is used — quarkus-oidc validates config structure, not connectivity).
quarkus.oidc.auth-server-url=http://localhost:8180/realms/test
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.keycloak.devservices.enabled=false
