# casehub-openclaw application configuration
# Named datasource for ChannelContextWindow ring buffer persistence
quarkus.datasource.openclaw.db-kind=h2
quarkus.datasource.openclaw.jdbc.url=jdbc:h2:mem:openclaw;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.openclaw.migrate-at-start=true
quarkus.flyway.openclaw.locations=classpath:db/migration

# ── Qhorus named persistence unit ────────────────────────────────────────────
# casehub-openclaw-casehub depends on casehub-qhorus, which declares the 'qhorus'
# persistence unit. Quarkus augmentation requires the datasource to be configured
# even though this app does not own the Qhorus schema — Qhorus flyway runs here.
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model
quarkus.flyway.qhorus.migrate-at-start=true
quarkus.flyway.qhorus.locations=classpath:db/qhorus/migration,classpath:db/ledger/migration

# Qhorus feature flags
casehub.qhorus.enabled=true
casehub.qhorus.reactive.enabled=false
casehub.qhorus.a2a.enabled=false
casehub.qhorus.watchdog.enabled=false

# casehub-ledger
casehub.ledger.enabled=true
casehub.ledger.datasource=qhorus

# OpenClaw Gateway connection (configure per deployment)
casehub.openclaw.gateway.url=http://localhost:18789
casehub.openclaw.gateway.bearer-token=${OPENCLAW_HOOK_TOKEN:changeme}
quarkus.rest-client.openclaw-gateway.url=${casehub.openclaw.gateway.url}

# ChannelContextWindow defaults
casehub.openclaw.context-window.buffer-size=100
casehub.openclaw.context-window.ttl-minutes=30

# ChannelContextWindow ring buffer configuration
casehub.openclaw.context-window.max-messages-per-channel=100
casehub.openclaw.context-window.ttl=PT30M

# Jackson: serialize dates as ISO-8601 strings (not timestamps)
quarkus.jackson.write-dates-as-timestamps=false

# CDI: exclude casehub-engine no-op SPI beans that collide with our blocking implementations.
# Only exclude the 3 blocking SPIs we implement — do NOT exclude reactive or WorkerContextProvider
# (we don't implement those; excluding them would leave them unsatisfied).
# See GE-20260428-9311f8 for root cause (symptom: classLoader=null on startup, CDI debug needed).
#
# Also exclude MockCurrentPrincipal from casehub-platform — it is a test stub that must be
# visible at augmentation (runtime scope in pom.xml; see protocol PP-20260524-a8f597) but
# must not participate in CDI bean resolution. QhorusInboundCurrentPrincipal (from casehub-qhorus)
# is the correct CurrentPrincipal for production use. Both are @DefaultBean; excluding the mock
# avoids AmbiguousResolutionException in the production deployment context.
quarkus.arc.exclude-types=\
  io.casehub.engine.internal.worker.NoOpWorkerProvisioner,\
  io.casehub.engine.internal.worker.NoOpCaseChannelProvider,\
  io.casehub.engine.internal.worker.NoOpWorkerStatusListener,\
  io.casehub.platform.mock.MockCurrentPrincipal

# OpenClaw agent capability configuration.
# One entry per pre-configured OpenClaw agent. Key = agentId (used for routing).
# session-key = OpenClaw session name (passed as sessionName in /hooks/agent).
# WARNING: sessionName field name unverified against live API — see openclaw#11.
casehub.openclaw.agents.finance-agent.capabilities=finance,banking
casehub.openclaw.agents.finance-agent.session-key=finance-agent

# Example controller defaults — override via docker-compose env vars per example
casehub.example.enabled=false
casehub.example.tenancyid=demo
casehub.example.timeout.seconds=300
# casehub.example.gate.agentid — not set here; Optional<String> in DemoGateClassifier
# Set per-example via CASEHUB_EXAMPLE_GATE_AGENTID in docker-compose
