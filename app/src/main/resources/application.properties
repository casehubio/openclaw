# casehub-openclaw application configuration
# Named datasource for ChannelContextWindow ring buffer persistence
quarkus.datasource.openclaw.db-kind=h2
quarkus.datasource.openclaw.jdbc.url=jdbc:h2:mem:openclaw;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.flyway.openclaw.migrate-at-start=true
quarkus.flyway.openclaw.locations=classpath:db/migration

# OpenClaw Gateway connection (configure per deployment)
casehub.openclaw.gateway.url=http://localhost:18789
casehub.openclaw.gateway.token=${OPENCLAW_HOOK_TOKEN:changeme}

# ChannelContextWindow defaults
casehub.openclaw.context-window.buffer-size=100
casehub.openclaw.context-window.ttl-minutes=30
