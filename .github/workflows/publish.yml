name: Publish

on:
  repository_dispatch:
    types: [upstream-published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout casehub-pages (sibling)
        uses: actions/checkout@v4
        with:
          repository: casehubio/casehub-pages
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: ../pages

      - name: Build pages packages
        working-directory: ../pages
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Checkout blocks-ui (sibling)
        uses: actions/checkout@v4
        with:
          repository: casehubio/blocks-ui
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: ../blocks-ui

      - name: Build blocks-ui packages
        working-directory: ../blocks-ui
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        if: github.event_name != 'pull_request' && success()
        run: |
          for repo in life; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
